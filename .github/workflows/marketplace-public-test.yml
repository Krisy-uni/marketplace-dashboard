name: Marketplace Public Data Test

on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test public Marketplace pages
        run: |
          python - <<'PY'
          import re
          from playwright.sync_api import sync_playwright

          urls = {
              "Marketplace home":
                  "https://www.facebook.com/marketplace/",
              "Brisbane browse":
                  "https://www.facebook.com/marketplace/brisbane/",
              "Brisbane furniture":
                  "https://www.facebook.com/marketplace/brisbane/furniture/",
          }

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(
                  viewport={"width": 1365, "height": 900}
              )

              for name, url in urls.items():
                  print(f"\n=== {name} ===")

                  try:
                      response = page.goto(
                          url,
                          wait_until="domcontentloaded",
                          timeout=45000
                      )
                      page.wait_for_timeout(4000)

                      print("HTTP:", response.status if response else "None")
                      print("Final URL:", page.url.split("?")[0])

                      cards = page.locator(
                          'a[href*="/marketplace/item/"]'
                      )

                      count = cards.count()
                      print("Listing links:", count)

                      matches = 0

                      for i in range(min(count, 5)):
                          card = cards.nth(i)

                          title = " ".join(
                              card.inner_text(timeout=5000).split()
                          )[:160]

                          image_count = card.locator("img").count()
                          prices = re.findall(
                              r"(?:AU\$|\$)\s*[\d,]+",
                              title
                          )

                          print(f"Item {i+1}:")
                          print("  Text:", title)
                          print("  Price detected:", prices[:2])
                          print("  Has image:", image_count > 0)

                          if "office chair" in title.lower():
                              matches += 1

                      print("Office chair matches in sample:", matches)

                  except Exception as exc:
                      print("Error:", type(exc).__name__, str(exc)[:150])

              browser.close()
          PY
